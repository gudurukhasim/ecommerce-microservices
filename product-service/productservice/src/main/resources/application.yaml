server:
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://mysql:3306/ecommerce?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: redis
      port: 6379
      client-type: jedis
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 600000