server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://mysql:3306/ecommerce?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379
      client-type: jedis
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

jwt:
  secret: ecommerce-secret-key-must-be-at-least-32-characters-long
  expiration: 86400000 # 24 hours in ms